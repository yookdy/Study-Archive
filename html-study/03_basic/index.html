<!DOCTYPE html>
<html lang = "ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content  = "width=devuce-width, initial-scale = 1.0">
    <title>입력 폼 연습</title>
    <style>
        body{
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background-color: #eaeeee;
        }
        header{
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            text-align: center;
        }
        nav{/*nav 영역 전체*/
            background-color: #333;
            padding: 15px;
            text-align: center;
        }
        nav a{/*nav 하나*/
            color: white;
            font-weight: bold;
            text-decoration: none;
            margin: 0 15px;
        }
        nav a:hover{
            color: #f39c12;
        }
        main{
            padding: 20px;
            max-width: 800px;
            margin: 20px auto;
            background-color: white;
            box-shadow: 0 20px 5px rgba(47, 23, 23, 0.1); min-height: 400px;
        }
        section{
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px soild #0e0e2a;
        }
        footer{
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>사용자 입력폼</h1>
    </header>
    <nav>
        <a href="#">홈</a>
        <a href="#">소개</a>
        <a href="#">포로젝트</a>
        <a href="#">연락처</a>
    </nav>
    <main>
        <section>
            <h2>시맨틱 태그란?</h2>
            <p>HTML5부터는 단순히 div로 구역을 나누는 것을 넘어, 태그 자체에 의미를 부여하는 시맨틱(Semantic) 태그를 사용하여 검색 엔진과 개발자 모두에게 명확한 구조를 제공합니다.</p>
        </section>
        <section>
            <h2>오늘의 학습 내용</h2>
            <p>상단의 header와 nav, 본문의 main과 section, 하단의 footer를 이용하여 실제 블로그나 웹사이트와 유사한 레이아웃을 만들었습니다.</p>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 My Dev Blog. All rights reserved.</p>
    </footer>
</body>
</html>
