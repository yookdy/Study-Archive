<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>진행률 표시와 자동완성 폼 연습</title>
    <style>
        body { 
            font-family: sans-serif; 
            padding: 20px; max-width: 600px; 
            margin: 0 auto; 
            line-height: 1.6; }
        fieldset {
            border: 2px solid #007bff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }
        legend {
            font-weight: bold;
            color: #007bff;
            padding: 0 10px;
            font-size: 1.1em;
        }
        .status-item {
             margin-bottom: 15px; 
            }
        label {
             display: block;
             font-weight: bold; 
             margin-bottom: 5px; }
        progress, meter { 
            width: 100%; 
            height: 24px; }
        input[list] { 
            width: 100%; 
            padding: 8px; 
            box-sizing: border-box; 
            border: 1px solid #ccc; 
            border-radius: 4px; }
    </style>
</head>
<body>
    <h1>학습 현황 대시보드</h1>

    <!-- 1. 진행률 및 게이지 표시 영역 -->
    <fieldset>
        <legend>진행도 및 시스템 상태</legend>
        
        <div class="status-item">
            <label for="html-progress">HTML 커리큘럼 진행률 (70%):</label>
            <!-- 작업의 완료 정도를 나타낼 때 사용 -->
            <progress id="html-progress" value="70" max="100">70%</progress>
        </div>

        <div class="status-item">
            <label for="disk-usage">저장 공간 사용량 (85% - 주의 단계):</label>
            <!-- 특정 범위 내의 측정값(용량, 온도, 점수 등)을 나타낼 때 사용 -->
            <meter id="disk-usage" value="85" min="0" max="100" low="30" high="80" optimum="20">85%</meter>
        </div>
    </fieldset>

    <!-- 2. 자동완성 목록(datalist) 활용 영역 -->
    <fieldset>
        <legend>다음 학습 주제 선택</legend>
        <label for="next-topic">학습할 언어나 프레임워크를 입력(또는 선택)하세요:</label>
        <!-- input의 list 속성과 datalist의 id 속성을 일치시켜 연결합니다 -->
        <input list="topics" id="next-topic" name="next-topic" placeholder="예: CSS, JavaScript...">
        
        <datalist id="topics">
            <option value="CSS Flexbox & Grid">
            <option value="JavaScript 기초">
            <option value="TypeScript">
            <option value="React">
            <option value="Next.js">
        </datalist>
    </fieldset>
</body>
</html>
