<!DOCTYPE html>
<html lang = "ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content  = "width=devuce-width, initial-scale = 1.0">
    <title>입력 폼 연습</title>
    <style>
        body{/*전체 디자인 */
            font-family: sans-serif;
            padding: 20px;
            max-width: 500px;
        }
        .form-group{
            margin-bottom: 15px;
            
        }
        /* 폼 그룹 스타일 */
        label{
            display: block;
            margin-bottom: 8px;
            box-sizing: border-box;
        }
        input[type= "text"], input[type = "email"], select, textarea{
            /*  input[type= "text"], input[type = "email"], select, textarea 디자인 통합*/
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button{
            background-color: #5293d9; 
            color: white; 
            padding: 10px 15px; 
            border: none; border-radius: 4px; 
            cursor: pointer;}
    </style>
</head>
<body>
    <h1>사용자 입력폼</h1>
    <form action = "#" method = "post">
        <div class = "form-group">
            <label for = "Username">이름:</label>
            <input type = "text" id ="Username" placeholder = "이름을 입력하세요" required>
        </div>
        <div class = "form-group">
            <label for = "Email">이메일:</label>
            <input type = "email" id ="Email" placeholder = "example@example.com">
        </div>
        <div class = "form-group">
            <label for "category">문의 유형:</label>
            <select id = "category" name "category">
                <option value = "general">일반 문의</option>
                <option value = "technical">버그 제보</option>
                <option value = "billing">피드백</option>
            </select>
        </div>
        <div class = "form-group">
            <label for = "message">의견 작성</label>
            <textarea id = "message" name="message" rows ="4" placeholder ="의견을 작성해주세요"></textarea>
        </div>

        <button type = "submit">제출</button>
    </form>
</body>
</html>
