<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content  = "width=devuce-width, initial-scale = 1.0">
    <title>웹 개발 연습</title>
    <style>
        body{
            font-family:sans-serif;
            line-height: 1.6;
            padding: 20px;
            max-width: 600px;
            }
        h1{
            color: #3f5264;
        }
        .box{
            background-color: #d3d3db;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>안녕하세요, html 연습중입니다.</h1>
    <div class="box">
        <h2>웹페이지 구성 요소</h2>
        <ul> <!-- ul은 •으로 목록으로 만듦 -->
             <!-- <strong>은 굵은 글짜  -->
            <li><strong>제목:</strong>h1부터 h6까지 크기별로 사용 가능합니다.</li> <!-- <li>는 목록 항목 -->
            <li><strong>단락:</strong>p 태그를 사용하여 단락을 만들 수 있습니다.</li>
            <li><strong>링크:</strong><a href ="https://www.google.com" target="_blank">a 태그로 외부 사이트 이동</a></li>
        </ul>
    </div>
</body>
</html>
